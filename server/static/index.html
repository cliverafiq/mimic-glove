<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Glove Hand — Live Dashboard</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0f0f0f; color: #e0e0e0; font-family: monospace; display: flex; flex-direction: column; align-items: center; padding: 40px 20px; gap: 40px; min-height: 100vh; }

    h1 { font-size: 1.4rem; letter-spacing: 0.1em; color: #fff; }
    #status { font-size: 0.75rem; color: #888; }
    #status.connected { color: #4caf50; }

    #mode-badge { font-size: 0.7rem; padding: 3px 10px; border-radius: 20px; background: #1e1e1e; color: #888; letter-spacing: 0.1em; text-transform: uppercase; }
    #mode-badge.simulate  { color: #4fc3f7; border: 1px solid #0288d1; }
    #mode-badge.recording { color: #ef5350; border: 1px solid #ef5350; animation: pulse 1s infinite; }
    #mode-badge.playback  { color: #66bb6a; border: 1px solid #66bb6a; }
    @keyframes pulse { 0%,100%{opacity:1}50%{opacity:.45} }

    #gesture-display { display: flex; flex-direction: column; align-items: center; gap: 4px; }
    #gesture-name { font-size: 1.6rem; font-weight: bold; letter-spacing: 0.08em; text-transform: uppercase; min-height: 2rem; transition: color 0.15s; color: #333; }
    #gesture-name.builtin  { color: #4fc3f7; }
    #gesture-name.recorded { color: #66bb6a; }
    #gesture-confidence { font-size: 0.65rem; color: #555; letter-spacing: 0.1em; min-height: 1em; }

    .section-label { font-size: 0.7rem; letter-spacing: 0.15em; color: #555; text-transform: uppercase; margin-bottom: 16px; text-align: center; }

    /* ── SVG hand ── */
    .finger-anim {
      transform-box: fill-box;
      transform-origin: 50% 100%;
      transition: transform 0.07s ease;
    }

    /* ── servo dials ── */
    #servos { display: flex; gap: 28px; flex-wrap: wrap; justify-content: center; }
    .servo-card { display: flex; flex-direction: column; align-items: center; gap: 8px; }
    .dial-wrap { position: relative; width: 72px; height: 72px; }
    .dial-wrap svg { width: 72px; height: 72px; }
    .dial-track { fill: none; stroke: #1e1e1e; stroke-width: 8; }
    .dial-fill  { fill: none; stroke: #66bb6a; stroke-width: 8; stroke-linecap: round;
                  transform: rotate(-90deg); transform-origin: 50% 50%;
                  transition: stroke-dashoffset 0.07s ease; }
    .dial-text  { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
    .dial-tick  { font-size: 0.6rem; color: #66bb6a; font-weight: bold; }
    .servo-name { font-size: 0.65rem; color: #aaa; }

    /* ── calibration table ── */
    .cal-table { width: 100%; border-collapse: collapse; font-size: 0.75rem; }
    .cal-table th { color: #555; font-weight: normal; text-align: left; padding: 4px 8px; border-bottom: 1px solid #222; }
    .cal-table td { padding: 5px 8px; color: #ccc; }
    .cal-table td.val { color: #4fc3f7; font-weight: bold; text-align: right; }
    .cal-table td.val.captured { color: #66bb6a; }
    .cal-actions { display: flex; gap: 10px; flex-wrap: wrap; }
    .btn-cal  { font-family: monospace; font-size: 0.8rem; padding: 7px 14px; border: none; border-radius: 6px; cursor: pointer; }
    .btn-flat { background: #1565c0; color: #fff; }
    .btn-flat:hover { background: #1976d2; }
    .btn-fist { background: #6a1b9a; color: #fff; }
    .btn-fist:hover { background: #7b1fa2; }
    .btn-save  { background: #2e7d32; color: #fff; }
    .btn-save:hover { background: #388e3c; }
    .btn-reset { background: #333; color: #aaa; }
    .btn-reset:hover { background: #444; }
    .cal-status { font-size: 0.7rem; color: #555; min-height: 1em; }
    .cal-status.ok  { color: #66bb6a; }
    .cal-status.err { color: #ef5350; }

    /* ── controls ── */
    .controls { display: flex; flex-direction: column; gap: 20px; width: 100%; max-width: 480px; }
    .control-panel { background: #161616; border: 1px solid #2a2a2a; border-radius: 10px; padding: 18px; display: flex; flex-direction: column; gap: 12px; }
    .row { display: flex; gap: 10px; align-items: center; }
    input[type="text"] { flex: 1; background: #0f0f0f; border: 1px solid #333; color: #e0e0e0; font-family: monospace; font-size: 0.85rem; padding: 7px 10px; border-radius: 6px; outline: none; }
    input[type="text"]:focus { border-color: #555; }
    button { font-family: monospace; font-size: 0.8rem; padding: 7px 14px; border: none; border-radius: 6px; cursor: pointer; letter-spacing: 0.05em; }
    .btn-record { background: #ef5350; color: #fff; }
    .btn-record:hover { background: #e53935; }
    .btn-stop   { background: #333; color: #e0e0e0; }
    .btn-stop:hover { background: #444; }
    .btn-play   { background: #1e1e1e; color: #66bb6a; border: 1px solid #2e2e2e; font-size: 0.75rem; padding: 4px 10px; }
    .btn-play:hover { background: #2a2a2a; }
    #gesture-list { display: flex; flex-wrap: wrap; gap: 8px; min-height: 28px; }
    .gesture-chip { display: flex; align-items: center; gap: 6px; background: #1e1e1e; border: 1px solid #2e2e2e; border-radius: 20px; padding: 4px 10px 4px 12px; font-size: 0.75rem; color: #ccc; }

    .pipeline-arrow { font-size: 1.4rem; color: #333; }
    #timestamp { font-size: 0.7rem; color: #444; }
  </style>
</head>
<body>

  <div style="display:flex;flex-direction:column;align-items:center;gap:6px;">
    <h1>GLOVE HAND</h1>
    <div style="display:flex;gap:10px;align-items:center;">
      <div id="status">connecting...</div>
      <div id="mode-badge">—</div>
    </div>
  </div>

  <!-- Gesture display -->
  <div id="gesture-display">
    <div id="gesture-name">—</div>
    <div id="gesture-confidence"></div>
  </div>

  <!-- Layer 2: SVG hand -->
  <div>
    <div class="section-label">glove — finger angles</div>
    <svg id="hand-svg" viewBox="0 0 260 370" width="220" height="314" style="display:block;margin:0 auto;">

      <!-- Fingers drawn first, palm drawn on top to cover their bases -->

      <!-- Pinky  (fa-4) knuckle x=183 -->
      <g transform="translate(183,228)">
        <g id="fa-4" class="finger-anim">
          <rect x="-9" y="-58" width="18" height="60" rx="9" fill="#1565c0"/>
          <rect x="-9" y="-58" width="18" height="12" rx="9" fill="#1976d2"/>
        </g>
      </g>

      <!-- Ring  (fa-3) knuckle x=151 -->
      <g transform="translate(151,225)">
        <g id="fa-3" class="finger-anim">
          <rect x="-11" y="-72" width="22" height="74" rx="11" fill="#1565c0"/>
          <rect x="-11" y="-72" width="22" height="13" rx="11" fill="#1976d2"/>
        </g>
      </g>

      <!-- Middle  (fa-2) knuckle x=119 -->
      <g transform="translate(119,222)">
        <g id="fa-2" class="finger-anim">
          <rect x="-11" y="-82" width="22" height="84" rx="11" fill="#1565c0"/>
          <rect x="-11" y="-82" width="22" height="14" rx="11" fill="#1976d2"/>
        </g>
      </g>

      <!-- Index  (fa-1) knuckle x=87 -->
      <g transform="translate(87,225)">
        <g id="fa-1" class="finger-anim">
          <rect x="-11" y="-72" width="22" height="74" rx="11" fill="#1565c0"/>
          <rect x="-11" y="-72" width="22" height="13" rx="11" fill="#1976d2"/>
        </g>
      </g>

      <!-- Thumb  (fa-0): base at left side of palm, natural angle -58° -->
      <g transform="translate(57,275) rotate(-58)">
        <g id="fa-0" class="finger-anim">
          <rect x="-10" y="-58" width="20" height="60" rx="10" fill="#1565c0"/>
          <rect x="-10" y="-58" width="20" height="12" rx="10" fill="#1976d2"/>
        </g>
      </g>

      <!-- Palm (drawn on top to cover finger bases) -->
      <rect x="50" y="228" width="160" height="118" rx="28" fill="#1a1a1a" stroke="#2a2a2a" stroke-width="1.5"/>

      <!-- Knuckle bumps -->
      <circle cx="87"  cy="228" r="11" fill="#212121" stroke="#2a2a2a" stroke-width="1"/>
      <circle cx="119" cy="225" r="11" fill="#212121" stroke="#2a2a2a" stroke-width="1"/>
      <circle cx="151" cy="225" r="11" fill="#212121" stroke="#2a2a2a" stroke-width="1"/>
      <circle cx="183" cy="228" r="9"  fill="#212121" stroke="#2a2a2a" stroke-width="1"/>

      <!-- Wrist -->
      <rect x="80" y="338" width="100" height="28" rx="14" fill="#161616" stroke="#2a2a2a" stroke-width="1"/>

      <!-- Angle labels -->
      <text id="lbl-0" x="45"  y="322" text-anchor="middle" font-family="monospace" font-size="9" fill="#555">—</text>
      <text id="lbl-1" x="87"  y="322" text-anchor="middle" font-family="monospace" font-size="9" fill="#555">—</text>
      <text id="lbl-2" x="119" y="322" text-anchor="middle" font-family="monospace" font-size="9" fill="#555">—</text>
      <text id="lbl-3" x="151" y="322" text-anchor="middle" font-family="monospace" font-size="9" fill="#555">—</text>
      <text id="lbl-4" x="183" y="322" text-anchor="middle" font-family="monospace" font-size="9" fill="#555">—</text>
    </svg>
  </div>

  <div class="pipeline-arrow">↓</div>

  <!-- Layer 3: Servo dials -->
  <div>
    <div class="section-label">robotic hand — servo pwm</div>
    <div id="servos">
      <div class="servo-card"><div class="dial-wrap"><svg viewBox="0 0 72 72"><circle class="dial-track" cx="36" cy="36" r="28"/><circle class="dial-fill" id="dial-0" cx="36" cy="36" r="28" stroke-dasharray="175.9" stroke-dashoffset="175.9"/></svg><div class="dial-text"><span class="dial-tick" id="tick-0">—</span></div></div><div class="servo-name">thumb</div></div>
      <div class="servo-card"><div class="dial-wrap"><svg viewBox="0 0 72 72"><circle class="dial-track" cx="36" cy="36" r="28"/><circle class="dial-fill" id="dial-1" cx="36" cy="36" r="28" stroke-dasharray="175.9" stroke-dashoffset="175.9"/></svg><div class="dial-text"><span class="dial-tick" id="tick-1">—</span></div></div><div class="servo-name">index</div></div>
      <div class="servo-card"><div class="dial-wrap"><svg viewBox="0 0 72 72"><circle class="dial-track" cx="36" cy="36" r="28"/><circle class="dial-fill" id="dial-2" cx="36" cy="36" r="28" stroke-dasharray="175.9" stroke-dashoffset="175.9"/></svg><div class="dial-text"><span class="dial-tick" id="tick-2">—</span></div></div><div class="servo-name">middle</div></div>
      <div class="servo-card"><div class="dial-wrap"><svg viewBox="0 0 72 72"><circle class="dial-track" cx="36" cy="36" r="28"/><circle class="dial-fill" id="dial-3" cx="36" cy="36" r="28" stroke-dasharray="175.9" stroke-dashoffset="175.9"/></svg><div class="dial-text"><span class="dial-tick" id="tick-3">—</span></div></div><div class="servo-name">ring</div></div>
      <div class="servo-card"><div class="dial-wrap"><svg viewBox="0 0 72 72"><circle class="dial-track" cx="36" cy="36" r="28"/><circle class="dial-fill" id="dial-4" cx="36" cy="36" r="28" stroke-dasharray="175.9" stroke-dashoffset="175.9"/></svg><div class="dial-text"><span class="dial-tick" id="tick-4">—</span></div></div><div class="servo-name">pinky</div></div>
    </div>
  </div>

  <!-- Controls -->
  <div class="controls">
    <!-- Calibration panel -->
    <div class="control-panel">
      <div class="section-label" style="margin:0;">calibration</div>
      <table class="cal-table">
        <thead>
          <tr>
            <th>finger</th>
            <th style="text-align:right">flat (0°)</th>
            <th style="text-align:right">fist (90°)</th>
          </tr>
        </thead>
        <tbody id="cal-tbody">
          <tr><td>thumb</td>  <td class="val" id="cal-flat-0">—</td><td class="val" id="cal-fist-0">—</td></tr>
          <tr><td>index</td>  <td class="val" id="cal-flat-1">—</td><td class="val" id="cal-fist-1">—</td></tr>
          <tr><td>middle</td> <td class="val" id="cal-flat-2">—</td><td class="val" id="cal-fist-2">—</td></tr>
          <tr><td>ring</td>   <td class="val" id="cal-flat-3">—</td><td class="val" id="cal-fist-3">—</td></tr>
          <tr><td>pinky</td>  <td class="val" id="cal-flat-4">—</td><td class="val" id="cal-fist-4">—</td></tr>
        </tbody>
      </table>
      <div class="cal-actions">
        <button class="btn-cal btn-flat" id="btn-cal-flat">① capture flat</button>
        <button class="btn-cal btn-fist" id="btn-cal-fist">② capture fist</button>
        <button class="btn-cal btn-save" id="btn-cal-save">save</button>
        <button class="btn-cal btn-reset" id="btn-cal-reset">reset</button>
      </div>
      <div class="cal-status" id="cal-status"></div>
    </div>

    <!-- Record gesture panel -->
    <div class="control-panel">
      <div class="section-label" style="margin:0;">record gesture</div>
      <div class="row">
        <input type="text" id="gesture-name" placeholder="gesture name (e.g. fist)" maxlength="32"/>
        <button class="btn-record" id="btn-record" onclick="startRecording()">record</button>
        <button class="btn-stop"   id="btn-stop"   onclick="stopRecording()" disabled>stop</button>
      </div>
    </div>
    <div class="control-panel">
      <div class="section-label" style="margin:0;">saved gestures</div>
      <div id="gesture-list"><span style="font-size:.75rem;color:#444">no gestures saved yet</span></div>
    </div>
  </div>

  <div id="timestamp"></div>

  <script>
    const statusEl = document.getElementById("status");
    const modeBadge = document.getElementById("mode-badge");
    const CIRCUMFERENCE = 175.9;

    // thumb curls less (anatomically shorter travel), others full range
    const ANGLE_SCALE  = [0.72, 1, 1, 1, 1];
    const LABEL_IDS    = ["lbl-0","lbl-1","lbl-2","lbl-3","lbl-4"];
    const FINGER_ANIM  = ["fa-0","fa-1","fa-2","fa-3","fa-4"];

    function connect() {
      const ws = new WebSocket(`ws://${location.host}/ws`);

      ws.onopen = () => { statusEl.textContent = "live"; statusEl.className = "connected"; };

      ws.onmessage = (e) => {
        const data = JSON.parse(e.data);

        // Animate SVG fingers
        data.angles.forEach((angle, i) => {
          const deg = angle * ANGLE_SCALE[i];
          document.getElementById(FINGER_ANIM[i]).style.transform = `rotate(${deg}deg)`;
          document.getElementById(LABEL_IDS[i]).textContent = angle.toFixed(0) + "°";
        });

        // Servo dials
        data.servos.forEach((s, i) => {
          const offset = CIRCUMFERENCE * (1 - s.angle / 90);
          document.getElementById(`dial-${i}`).style.strokeDashoffset = offset;
          document.getElementById(`tick-${i}`).textContent = s.pwm_tick;
        });

        document.getElementById("timestamp").textContent = `t = ${data.timestamp.toFixed(2)}s`;
        modeBadge.textContent = data.mode;
        modeBadge.className = data.mode;

        const g = data.gesture;
        const nameEl = document.getElementById("gesture-name");
        const confEl = document.getElementById("gesture-confidence");
        if (g.gesture) {
          nameEl.textContent = g.gesture.replace(/_/g, " ");
          nameEl.className = g.source;
          confEl.textContent = g.source === "recorded"
            ? `recorded · ${Math.round(g.confidence * 100)}% match`
            : "built-in";
        } else {
          nameEl.textContent = "—";
          nameEl.className = "";
          confEl.textContent = "";
        }
      };

      ws.onclose = () => {
        statusEl.textContent = "disconnected — retrying...";
        statusEl.className = "";
        setTimeout(connect, 2000);
      };
    }

    connect();

    async function startRecording() {
      const name = document.getElementById("gesture-name").value.trim().replace(/[^a-zA-Z0-9_-]/g,"_");
      if (!name) { alert("Enter a gesture name first."); return; }
      await fetch(`/record/start/${name}`, { method: "POST" });
      document.getElementById("btn-record").disabled = true;
      document.getElementById("btn-stop").disabled = false;
    }

    async function stopRecording() {
      await fetch("/record/stop", { method: "POST" });
      document.getElementById("btn-record").disabled = false;
      document.getElementById("btn-stop").disabled = true;
      document.getElementById("gesture-name").value = "";
      loadGestures();
    }

    async function playGesture(name) {
      await fetch(`/playback/${name}`, { method: "POST" });
    }

    async function loadGestures() {
      const { gestures } = await (await fetch("/gestures")).json();
      const list = document.getElementById("gesture-list");
      if (!gestures.length) {
        list.innerHTML = '<span style="font-size:.75rem;color:#444">no gestures saved yet</span>';
        return;
      }
      list.innerHTML = "";
      gestures.forEach(g => {
        const chip = document.createElement("div");
        chip.className = "gesture-chip";
        chip.textContent = g + " ";
        const btn = document.createElement("button");
        btn.className = "btn-play";
        btn.textContent = "▶ play";
        btn.dataset.gesture = g;
        btn.addEventListener("click", () => playGesture(g));
        chip.appendChild(btn);
        list.appendChild(chip);
      });
    }

    loadGestures();
    loadCalibration();

    document.getElementById("btn-cal-flat").addEventListener("click", captureFlat);
    document.getElementById("btn-cal-fist").addEventListener("click", captureFist);
    document.getElementById("btn-cal-save").addEventListener("click", saveCalibration);
    document.getElementById("btn-cal-reset").addEventListener("click", resetCalibration);

    // ── Calibration ────────────────────────────────────────
    function renderCalibration(data) {
      data.fingers.forEach((f, i) => {
        document.getElementById(`cal-flat-${i}`).textContent = f.flat;
        document.getElementById(`cal-fist-${i}`).textContent = f.fist;
      });
    }

    function flashCaptured(prefix) {
      for (let i = 0; i < 5; i++) {
        const el = document.getElementById(`cal-${prefix}-${i}`);
        el.classList.add("captured");
        setTimeout(() => el.classList.remove("captured"), 1200);
      }
    }

    function setCalStatus(msg, type = "") {
      const el = document.getElementById("cal-status");
      el.textContent = msg;
      el.className = `cal-status ${type}`;
    }

    async function loadCalibration() {
      const data = await (await fetch("/calibration")).json();
      renderCalibration(data);
    }

    async function captureFlat() {
      const data = await (await fetch("/calibration/capture/flat", { method: "POST" })).json();
      renderCalibration(data);
      flashCaptured("flat");
      setCalStatus("flat position captured — now make a fist and click ② capture fist", "ok");
    }

    async function captureFist() {
      const data = await (await fetch("/calibration/capture/fist", { method: "POST" })).json();
      renderCalibration(data);
      flashCaptured("fist");
      setCalStatus("fist position captured — click save to apply", "ok");
    }

    async function saveCalibration() {
      await fetch("/calibration/save", { method: "POST" });
      setCalStatus("calibration saved ✓", "ok");
      setTimeout(() => setCalStatus(""), 2500);
    }

    async function resetCalibration() {
      const data = await (await fetch("/calibration/reset", { method: "POST" })).json();
      renderCalibration(data);
      setCalStatus("reset to defaults", "");
    }
  </script>
</body>
</html>
